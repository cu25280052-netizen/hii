<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Portfolio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>My Portfolio</h1>
    <nav>
        <ul>
            <li><a href="#home">Home</a></li>
            <li><a href="#about">About</a></li>
            <li><a href="#skills">Skills</a></li>
            <li><a href="#projects">Projects</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
    </nav>
</header>

<section id="home">
    <h2>Welcome</h2>
    <p>Hello! I'm a Web Developer.</p>
</section>

<section id="about">
    <h2>About Me</h2>
    <p>I am a student passionate about web development.</p>
</section>

<section id="skills">
    <h2>Skills</h2>
    <ul>
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
    </ul>
</section>

<section id="projects">
    <h2>Projects</h2>
    <button onclick="showProject()">Show Project</button>
    <p id="projectDisplay"></p>
</section>

<section id="contact">
    <h2>Contact</h2>
    <form id="contactForm">
        <input type="text" id="name" placeholder="Your Name"><br>
        <input type="email" id="email" placeholder="Your Email"><br>
        <button type="submit">Submit</button>
    </form>
    <p id="formMsg"></p>
</section>

<script src="script.js"></script>
</body>
</html>
